<div class="shell">
  <div class="sidebar-backdrop" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="brand">
      <img class="brand-logo" src="/logo-bofasa-icon.png" alt="BOFASA">
      <div class="brand-text">
        <h1>SGMB</h1>
        <p>Sistema de Mantenimiento</p>
      </div>
    </div>

    <nav class="nav">
      <a *ngFor="let item of navItems"
         class="nav-item"
         [routerLink]="item.path"
         routerLinkActive="active">
        <span class="nav-icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'grid'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 2.9-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M15 14.2c2.7.4 4.5 2.4 4.5 5.3"/></svg>
          <svg *ngSwitchCase="'building'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="10" height="18" rx="1"/><path d="M14 8h6v13h-6"/><path d="M7 7h1M7 11h1M7 15h1"/></svg>
          <svg *ngSwitchCase="'box'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
          <svg *ngSwitchCase="'ticket'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/></svg>
          <svg *ngSwitchCase="'calendar'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
          <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          <svg *ngSwitchCase="'clipboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="17" rx="1.5"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 11h6M9 15h6"/></svg>
        </span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="theme-toggle" (click)="themeService.toggle()">
        <span class="theme-icon">{{ themeService.dark() ? '☀' : '🌙' }}</span>
        {{ themeService.dark() ? 'Modo claro' : 'Modo oscuro' }}
      </button>
      <button class="logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="content-area">
    <header class="topbar">
      <button class="menu-btn" (click)="toggleSidebar()" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="search-box" *ngIf="showSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Buscar equipos, solicitudes, visitas, sucursales..." [(ngModel)]="searchTerm" (ngModelChange)="onSearchInput()" />
      </div>

      <div class="notifications" *ngIf="user?.role === 'tecnico'">
        <button type="button" class="notif-btn" (click)="toggleNotifications()" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge" *ngIf="activeTasks.length > 0">{{ activeTasks.length }}</span>
        </button>

        <div class="notif-panel" *ngIf="showNotifications">
          <h3>Tareas asignadas</h3>
          <p class="notif-empty" *ngIf="activeTasks.length === 0">No tienes tareas activas</p>
          <div class="notif-item" *ngFor="let task of activeTasks" (click)="goToTaskAssets(task)">
            <strong>{{ taskTypeLabel(task.task_type) }}</strong>
            <span>{{ task.branch_name }}</span>
            <small *ngIf="task.notes">{{ task.notes }}</small>
          </div>
          <a class="notif-viewall" routerLink="/assigned-tasks" (click)="showNotifications = false">Ver todas mis tareas</a>
        </div>
      </div>

      <div class="user-area" *ngIf="user">
        <div class="user-info">
          <strong>{{ user.name }}</strong>
          <span>{{ user.role | titlecase }}</span>
        </div>
        <div class="avatar">{{ initials }}</div>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
