<div class="toast-stack">
  <div class="toast" *ngFor="let toast of toastService.toasts()" [class]="toast.type">
    <span class="toast-icon">{{ iconFor(toast.type) }}</span>
    <span class="toast-message">{{ toast.message }}</span>
    <button type="button" class="toast-close" (click)="toastService.dismiss(toast.id)" aria-label="Cerrar">&times;</button>
  </div>
</div>
