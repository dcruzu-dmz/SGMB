<div class="login-container">
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="login-card">
    <img class="card-logo" src="/logo-bofasa.png" alt="BOFASA">
    <h1 class="card-title">SGMB</h1>
    <p class="card-subtitle">Sistema de Gestión de Mantenimiento</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="admin@sgmb.com"
          />
        </div>
        <span class="field-error"
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Ingresa un correo válido
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
          />
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
        <span class="field-error"
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          La contraseña es requerida
        </span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="loading-dots">Ingresando</span>
      </button>

    </form>

    <p class="error" *ngIf="errorMessage">⚠ {{ errorMessage }}</p>

    <div class="login-footer">
      <img class="footer-brands" src="/logo-bofasa-marcas.png" alt="Bodega Farmacéutica, Meykos, Cruz Verde, Farmacias del Ahorro">
      <p>SGMB © 2026 — Todos los derechos reservados</p>
    </div>
  </div>
</div>
