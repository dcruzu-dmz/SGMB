name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (tests y migraciones)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sgmb
          POSTGRES_PASSWORD: sgmb
          POSTGRES_DB: sgmb_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Valores solo para CI; no son credenciales reales.
      DATABASE_URL: postgresql+psycopg2://sgmb:sgmb@localhost:5432/sgmb_ci
      SECRET_KEY: ci-solo-pruebas-clave-de-al-menos-32-bytes
      # Base desechable para tests que necesitan Postgres real; el test crea y borra
      # las tablas antes de que corran las migraciones.
      TEST_POSTGRES_URL: postgresql+psycopg2://sgmb:sgmb@localhost:5432/sgmb_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # test_integration.py queda fuera: depende de los datos de la base de desarrollo.
      - name: Tests unitarios
        run: python -m pytest tests/test_units.py tests/test_units_v2.py tests/test_authz.py tests/test_scheduler_lock.py tests/test_token_identity.py -q
      - name: Migraciones desde cero
        run: alembic upgrade head
      - name: Modelos y migraciones coinciden
        run: alembic check
      - name: Las migraciones se pueden revertir
        run: alembic downgrade base && alembic upgrade head

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de produccion
        run: npx ng build
